# Default settings. Do not edit this file to personalise the skill:
# put your own values in <project folder>/config.yaml (same layout, only the
# keys you want to change). See config/config.example.yaml.

# === Pipeline ===
pipeline:
  project_dir: null  # Set per run by the command line
  checkpoint_frequency: 5
  parallel_workers: 1

# === OCR (Google Gemini) ===
# Model IDs change over time. If Google retires one, change it here or in
# your config.yaml. Current list: https://ai.google.dev/gemini-api/docs/models
ocr:
  primary_provider: gemini
  model: gemini-3.6-flash               # page classification and single-page reading
  multi_image_model: gemini-3.8-flash   # full letter reading (all pages in one call)
  verification_model: gemini-3.6-flash  # second look at the extracted fields
  fallback_model: gemini-3.8-flash      # second opinion for hard-to-read pages
  llm_flash_model: gemini-3.6-flash     # optional AI assisted matching (off by default)
  llm_pro_model: gemini-3.8-flash
  temperature: 0.3
  rate_limit_seconds: 4
  max_retries: 3
  retry_backoff: [10, 20, 30]
  confidence_threshold: 0.50      # Below = unreadable
  low_confidence_threshold: 0.85  # Below = second opinion from fallback_model
  enable_extended_thinking: true  # For court documents (escalation >= 4)
  thinking_level: high                # low | medium | high (letter reading)
  verification_thinking_level: low    # low | medium | high (second look)
  enable_opus_fallback: true      # Second opinion for low confidence pages (uses fallback_model)
  enable_consensus: false         # Needs extra OCR providers that are not bundled; leave off
  extended_thinking_confidence_threshold: 0.70

# === People (optional) ===
# Leave empty for a single household. Fill in only if post for several
# people is mixed and you want it separated.
persons:
  known_names: []        # e.g. ["Sam", "Jo"]: short labels shown in the sheet
  address_surnames: []   # e.g. ["Example"]: surnames as printed in the address block
  aliases: {}            # e.g. {Sam: ["Samuel Example", "S. Example"]}
  accounts: {}           # e.g. {Sam: [{iban: "GB00XXXX00000000000000", label: "main"}]}
                         # label must be part of the bank CSV file name

# === Grouping photos into documents ===
grouping:
  burst_threshold_seconds: 7
  doc_threshold_seconds: 45
  oversized_threshold: 15
  confidence_modifiers:
    oversized: 0.30
    large: 0.50
    ambiguous_boundary: 0.80
    singleton: 0.60
    ideal: 1.10

# === Matching letters into cases ===
matching:
  split_threshold: 4
  creditor_confidence: 0.7
  amount_tolerance_percent: 5
  amount_tolerance_absolute_eur: 50.00
  max_letters_per_vorgang: 8
  fuzzy_creditor_threshold: 0.85
  reference_min_length: 8
  enable_llm_matching: false
  company_suffixes: ["gmbh", "ag", "kg", "e.v.", "aör", "mbh", "se", "& co.", "ltd", "limited", "plc", "llp", "inc", "llc"]
  escalation_map:
    rechnung: 0
    mahnung_1: 1
    mahnung_2: 2
    mahnung_3: 3
    mahnbescheid: 4
    vollstreckung: 5
    pfaendung: 6

# === Bank reconciliation ===
# The "_eur" keys are plain amounts in whatever currency your letters use.
reconciliation:
  amount_tolerance_eur: 0.50
  reference_min_length: 8
  reference_confidence: 0.95
  amount_date_confidence: 0.85
  compound_match_confidence: 0.75
  bezahlt_threshold_pct: 99
  teilweise_lower_pct: 90
  require_creditor_match: true
  enable_fuzzy_matching: true
  fuzzy_threshold: 0.90
  date_tolerance_days: 365
  enable_llm_reconciliation: false
  reference_amount_diff_confidence: 0.80
  review_confidence_threshold: 0.90
  high_value_threshold_eur: 1000
  high_value_confidence_threshold: 0.95
  composite_weights:
    amount: 0.5
    creditor: 0.3
    date: 0.2
  amount_tolerance_abs_floor: 2.00

# === Priority ===
priority:
  gerichtlich_threshold: 4   # escalation level that counts as "court"
  kritisch_threshold: 3
  dringend_amount: 500       # open amount above this is "soon"
  critical_creditors: []     # e.g. ["my landlord ltd"]: always at least critical

# === Bank CSV ===
# Column names are detected automatically for most bank exports. If yours
# is not recognised, name the columns here (exactly as in the CSV header).
bank:
  delimiter: ";"             # tried first, then ";" "," and tab
  encoding_fallback: ["utf-8-sig", "utf-8", "latin-1", "cp1252"]
  date_format: null          # e.g. "%m/%d/%Y" for US style dates; null = automatic
  columns: {}                # e.g. {date: "Date", details: "Description", amount: "Amount"}
                             # roles: date, details, payee, iban, debit, credit, amount

# === Output ===
output:
  destination: local         # local | google | both
  language: en               # en | de (labels in the workbook)
  currency: GBP              # shown next to totals. EUR also switches on SEPA QR codes
  local_dir: output          # folder inside the project for the workbook and CSV files
  sheet_prefix: "Post summary"
  top_creditors: 10
  qr_scale: 10
  qr_border: 4
  conditional_format_colors:
    gerichtlich: {red: 1.0, green: 0.4, blue: 0.4}
    kritisch: {red: 1.0, green: 0.7, blue: 0.3}
    dringend: {red: 1.0, green: 1.0, blue: 0.5}

# === Quality checks ===
qc:
  e2e_sample_size: 20
  amount_mismatch_threshold: 50
  date_range: [2020, 2035]
  enable_anomaly_detection: true
  expected_photos: null             # set a number to have the photo count verified
  expected_financial_total: null    # set a number to have the grand total verified
  pipeline_confidence_threshold: 0.50
  recon_confidence_threshold: 0.85
  recon_max_pct_below: 30
  numeric_references_valid: true
  flag_exemption_patterns:
    - "AUDIT_DEEP:*"
    - "AUDIT_V*:*"
    - "V11_*"
    - "FALSE_POSITIVE_*"
    - "KNOWN_IBAN_EXCEPTION:*"
  known_iban_exceptions: []

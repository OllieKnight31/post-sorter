# Your personal settings for one project folder.
# "cli.py <project> --init" copies this file to <project>/config.yaml.
# Everything here is optional. Remove the "#" in front of a line to use it.
# All available settings and their defaults: config/defaults.yaml in the skill.

output:
  destination: local      # local = XLSX and CSV on your Mac. google or both = also a Google Sheet
  currency: GBP           # label next to totals. EUR also switches on SEPA payment QR codes
  # language: en          # en or de

